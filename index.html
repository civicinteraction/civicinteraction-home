<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civic Interaction for Democracy</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter+Tight:wght@400;500&family=Fraunces:opsz,wght@9..144,800&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FCFBF8;color:#1E2A38;font-family:'Inter Tight',system-ui,sans-serif}
.wrap{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:flex-end;padding:22px 28px}
.quiet{background:none;border:0;padding:10px 4px;min-height:44px;font:inherit;font-size:14px;letter-spacing:.02em;color:#2F5E94;cursor:pointer}
.quiet:hover{color:#1E3F66}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px 64px}
.col{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.col img{width:100%;max-width:360px;height:auto}
.col h1.line{margin:56px 0 0;font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:clamp(20px,2.8vw,26px);line-height:1.12;letter-spacing:-.01em;color:#2F5E94;text-shadow:0 1px 0 rgba(255,255,255,.9),0 -1px 0 rgba(10,20,32,.18)}
.rule{width:56px;height:2px;background:#2F5E94}
.col p.tag{margin:0;max-width:480px;font-family:'Source Serif 4',Georgia,serif;font-size:19px;line-height:1.55;color:#45566A;text-wrap:balance}
.col p.tag span{display:block}
form{width:100%;max-width:320px;margin:20px 0 0;display:flex;flex-direction:column;gap:14px;text-align:left}
form[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input{height:44px;padding:0 2px;font-size:16px;font-family:inherit;border:0;border-bottom:1px solid #CFCBC2;background:transparent;color:#1E2A38;border-radius:0;transition:border-color .15s}
input:focus{outline:none;border-bottom-color:#2F5E94}
input::placeholder{color:#9AA3AD}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.row span{font-size:13px;color:#6B7682}
.go{height:44px;padding:0 22px;border:0;border-radius:999px;background:#1E2A38;color:#fff;font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.go:hover{background:#2F5E94}
.quiet:focus-visible,.go:focus-visible{outline:2px solid #00ADEF;outline-offset:3px}
.err{margin:4px 0 0;font-size:13px;line-height:1.5;color:#A32028}
footer{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;padding:24px;font-size:13px;color:#2F5E94}
footer a{color:#2F5E94;text-decoration:none}footer a:hover{color:#1E3F66}
</style>
</head>

<div class="wrap">
<header><button class="quiet" id="toggle" type="button" aria-expanded="false" aria-controls="f">Sign in</button></header>
