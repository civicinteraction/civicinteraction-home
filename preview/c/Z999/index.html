<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sources</title>
<style>
@font-face{font-family:'Newsreader';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/newsreader-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/newsreader-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2')}

:root{
  --ink:#1B1A17; --muted:#56606C; --rule:#D3DAE3; --tint:#EEF2F7; --paper:#FFFFFF;
  --brand:#2F5E94; --brand-dark:#1F4673;
  --amber:#8F4F08; --amber-rule:#E4D3BF; --since-on-ink:#D9D4CA;
  --serif:Newsreader,Georgia,serif; --sans:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:16px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body{border-top:6px solid var(--brand)}
a{color:var(--brand);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--brand-dark);text-decoration-thickness:2px}
.wrap{max-width:1152px;margin:0 auto;padding:22px 20px 40px}
.logo{display:inline-block;margin-bottom:14px}
.logo img{display:block;width:112px;height:auto}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.kicker{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--brand);color:var(--brand);padding-bottom:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.kicker .copy{color:var(--muted)}
h1{margin:16px 0 14px;font:600 31px/1.1 var(--serif)}
.is-retired h1{color:var(--muted)}
.h2{margin:34px 0 0;padding-top:8px;border-top:2px solid var(--brand);color:var(--brand);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.status{border:1.5px solid var(--ink);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.status svg{flex:none;margin-top:3px}
.status p{margin:0;font-size:15px;line-height:1.45;font-weight:600}
.status .since{display:block;margin-top:6px;font-size:12px;color:var(--muted);font-weight:400}
.status .tail{display:block;margin-top:6px;font-size:13px;font-weight:400}
.status.checked{background:var(--ink);color:var(--paper)}
.status.checked .since{color:var(--since-on-ink)}
.status.retired{border-style:dashed}
.newer{margin:10px 0 0;font-size:14px}
.correction{margin-top:18px;border:1.5px solid var(--amber);padding:14px}
.correction .lbl{color:var(--amber);font-weight:700}
.correction .holder{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--amber-rule);font-size:14px}
.correction dl.meta{margin-top:12px}
.correction .was{text-decoration:line-through}
.correction .now{font-weight:600}
.figlist ol{list-style:none;margin:0;padding:0}
.figlist li{border-bottom:1px solid var(--rule)}
.figlist a{display:flex;align-items:center;gap:12px;min-height:48px;text-decoration:none;font-size:15px;color:var(--ink)}
.figlist .n{width:22px;font-size:13px;font-weight:600;color:var(--brand)}
.figlist .t{flex:1}
.figlist .chev{color:var(--muted)}
.fig{padding:18px 0 20px;border-bottom:1px solid var(--rule);scroll-margin-top:12px}
.fig:last-child{border-bottom:0}
.fv{margin:4px 0 6px;font:600 26px/1.15 var(--serif)}
.fig .means{margin:0;font-size:15px}
dl.meta{display:grid;grid-template-columns:84px minmax(0,1fr);column-gap:12px;row-gap:8px;margin:14px 0 0;font-size:14px;line-height:1.45}
dl.meta dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);padding-top:2px}
dl.meta dd{margin:0}
.q{font-family:var(--mono);font-size:13px;background:var(--tint);padding:1px 5px;border-radius:3px}
.chk{display:flex;align-items:center;gap:6px}
.walled{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border:1px solid var(--muted);color:var(--muted);padding:0 5px;border-radius:3px;margin-left:6px}
.walled-note{display:block;margin-top:4px;color:var(--muted);font-size:13px}
.rep{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;font-size:14px}
/* G4: an inline link's hit area, 44 px at phone width, with the text flow untouched. The
   padding grows the box and the equal negative margin gives the layout back what it took. */
.in{padding:14px 0;margin:-14px 0}
.calc{margin:6px 0 4px;font:14px/1.5 var(--mono);background:var(--tint);padding:8px 10px}
.calcblock{padding:14px 0;border-bottom:1px solid var(--rule)}
.calcblock:last-child{border-bottom:0}
.none{margin:12px 0 0;font-size:15px}
.quiet{color:var(--muted);font-size:14px}
.gap{color:var(--muted)}
.docgroup{margin-top:16px}
.doc{padding:12px 0;border-bottom:1px solid var(--rule)}
.doc .title{font-weight:600;font-size:15px}
.doc .by{color:var(--muted);font-size:14px}
.doc .links{margin-top:6px;font-size:14px}
.doc .used{margin-top:4px;font-size:13px;color:var(--muted)}
.doc .kind{display:none}
.dochead{display:none}
.hist{padding:12px 0;border-bottom:1px solid var(--rule);font-size:15px}
.hist:last-child{border-bottom:0}
.hist .when{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.report{padding:16px;background:var(--tint)}
.report p{margin:0 0 10px;font-size:15px;line-height:1.45}
.report a{display:flex;align-items:center;justify-content:center;min-height:48px;border:1.5px solid var(--brand);color:var(--brand);background:var(--paper);font-weight:600;font-size:15px;text-decoration:none}
.cardimg{display:block;width:100%;max-width:816px;height:auto;margin-top:12px;border:1px solid var(--rule)}
.foot{padding-top:10px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.foot a{color:var(--muted)}
.summary{display:none}
.dt{display:none}
.layout{display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-areas:"title" "status" "corr" "nav" "figs" "calc" "docs" "hist" "report" "card" "foot"}
.a-title{grid-area:title} .a-status{grid-area:status} .a-corr{grid-area:corr} .a-figs{grid-area:figs}
.a-calc{grid-area:calc} .a-docs{grid-area:docs} .a-hist{grid-area:hist} .a-card{grid-area:card}
aside{display:contents}
aside .figlist{grid-area:nav;margin-top:26px}
aside .report{grid-area:report;margin-top:34px}
aside .foot{grid-area:foot;margin-top:36px}
.nr{max-width:560px}
.nr h1{margin-top:22px}
.nr p{margin:0 0 14px;font-size:16px}
.nr .foot{margin-top:28px}
@media (min-width:960px){
  .wrap{padding:40px 64px 56px}
  .logo{margin-bottom:18px}
  .logo img{width:150px}
  .kicker{font-size:12px}
  h1{font-size:46px;margin:22px 0 18px;line-height:1.08}
  .status{max-width:680px;padding:14px 18px}
  .status p{font-size:16px}
  .correction{max-width:680px}
  .h2{margin-top:44px}
  .layout{grid-template-columns:minmax(0,1fr) 300px;column-gap:56px;
    grid-template-areas:"title rail" "status rail" "corr rail" "figs rail" "calc rail" "docs rail" "hist rail" "card rail"}
  aside{display:flex;flex-direction:column;gap:28px;grid-area:rail;align-self:start;position:sticky;top:24px;padding-top:26px}
  aside .figlist,aside .report,aside .foot{margin-top:0}
  aside .figlist a{min-height:0;padding:9px 0;font-size:14px}
  aside .figlist .chev{display:none}
  .summary{display:block}
  .summary dl.meta{grid-template-columns:84px minmax(0,1fr);font-size:13px;margin-top:10px}
  .report a{min-height:44px;font-size:14px}
  .report p{font-size:14px}
  .foot{border-top:0;padding-top:0;flex-direction:column;gap:4px;font-size:13px}
  .fig{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);column-gap:40px;padding:22px 0 18px}
  .fv{font-size:28px}
  dl.meta{margin-top:0;grid-template-columns:96px minmax(0,1fr);column-gap:14px}
  .rep{min-height:36px;font-size:13px}
  .in{padding:0;margin:0}
  .dochead{display:grid}
  .dochead,.doc{grid-template-columns:minmax(0,3fr) minmax(0,1.3fr) minmax(0,2.4fr) minmax(0,1.6fr);column-gap:16px}
  .dochead{padding:6px 0;border-bottom:1px solid var(--ink);margin-top:12px}
  .doc{display:grid;font-size:14px}
  .doc .links,.doc .used{margin-top:0}
  .doc .kind{display:block}
  .doc .kindinline{display:none}
  .ph{display:none}
  .dt{display:inline}
}
</style>
</head>

</div>
</body>
</html>
