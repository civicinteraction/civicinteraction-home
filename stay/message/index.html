<h2>Send us a message</h2>
<form method="post" novalidate data-kind="message" data-next="/stay/sent/">
<label class="f" for="ms">Your message</label><textarea id="ms" name="message" placeholder="A question, a thought, something that came up after we talked — anything" data-required></textarea>
<label class="f" for="nm">What should we call you?</label><input type="text" id="nm" name="name" autocomplete="given-name" placeholder="Your name or a nickname">
<label class="f" for="em">Want a reply? <small>(optional)</small></label><input type="text" id="em" name="reply" placeholder="Your email or cell number">
<div class="hp" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>
<button class="btn" type="submit">Send</button>
</form>
<p class="note">Or reach us directly: <a href="sms:+16284444711">628-444-4711</a> · <a href="mailto:adam@civicinteraction.org">adam@civicinteraction.org</a></p>
