<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<title>Is something you heard really true? · Civic Interaction</title><link rel="stylesheet" href="/stay/style.css"><script src="/stay/stay.js" defer></script></head>
<body><div class="page"><div class="band"></div><div class="scr">
<a href="https://civicinteraction.org/"><img class="logo" src="/stay/logo.png" width="128" height="81" alt="Civic Interaction for Democracy"></a>
<a class="back" href="/stay/">‹ Back</a>
<h2>Is something you heard really true?</h2>
<p class="sub">Someone will check it against the record and get back to you.</p>
<p class="lede">Send us a post, a video, a text, or just tell us what you heard or saw.</p>
<form method="post" novalidate data-kind="claim" data-next="/stay/sent/">
<label class="f" for="cl">What did you hear or see?</label><textarea id="cl" name="claim" placeholder="Paste it, or describe it in your own words" data-required></textarea>
<label class="f" for="ln">Add a link or a picture <small>(optional)</small></label><input type="url" id="ln" name="link" inputmode="url" placeholder="https://">
<label class="file"><input type="file" name="picture" accept="image/*">Add a picture</label>
<label class="f" for="nm">What should we call you?</label><input type="text" id="nm" name="name" autocomplete="given-name" placeholder="Your name or a nickname">
<p class="f" id="rq">Where should we send the answer?</p><div role="group" aria-labelledby="rq">
<label class="f2" for="em">Email</label><input type="email" id="em" name="email" autocomplete="email" data-one-of="reach">
<label class="f2" for="ce">Cell</label><input type="tel" id="ce" name="cell" autocomplete="tel" data-one-of="reach"></div>
<fieldset class="pref" id="pf" hidden disabled><legend>How should we reply?</legend>
<label class="opt"><input type="radio" name="reply_by" value="text">Text</label><label class="opt"><input type="radio" name="reply_by" value="email">Email</label><label class="opt"><input type="radio" name="reply_by" value="both" checked>Both</label></fieldset>
<div class="hp" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>
<button class="btn" type="submit">Send</button>
</form>
<p class="note">Or text us at <a href="sms:+16284444711">628-444-4711</a>.</p>
</div></div></body></html>
